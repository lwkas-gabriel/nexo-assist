name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Menor privilégio: o workflow só lê o repositório.
permissions:
  contents: read

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions fixadas pelo hash do commit (tags podem ser movidas); a versão fica no comentário.
jobs:
  quality:
    name: Qualidade (tipos, lint, formatação, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright, desktop e celular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Criar .env de cada app a partir do .env.example
        run: pnpm setup:env
      - name: Instalar o Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    name: Segurança (segredos e dependências)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # o gitleaks lista os commits do PR para varrer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo: o gitleaks varre todos os commits, não só o último
      - name: Procurar segredos no histórico (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false # sem permissão de escrita em PRs
      - uses: ./.github/actions/setup
      - name: Auditar dependências (falha em vulnerabilidade alta ou crítica)
        run: pnpm audit --audit-level=high
